<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Details</title>
    <link rel="stylesheet" href="https://bootstrapcdn.com">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">{{ course.name }}</h1>
        <p class="lead">{{ course.description }}</p>

        <h3 class="mt-5 mb-3">Exam</h3>
        <form id="exam-form" action="{% url 'onlinecourse:submit' course.id %}" method="post">
            {% csrf_token %}
            {% for question in course.question_set.all %}
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5>{{ forloop.counter }}. {{ question.question_text }}</h5>
                    </div>
                    <div class="card-body">
                        {% for choice in question.choice_set.all %}
                            <div class="form-check my-2">
                                <input class="form-check-input" type="checkbox" name="choice_{{ choice.id }}" id="choice_{{ choice.id }}" value="{{ choice.id }}">
                                <label class="form-check-label" for="choice_{{ choice.id }}">
                                    {{ choice.choice_text }}
                                </label>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-success btn-lg mt-3">Submit Exam</button>
        </form>
    </div>
</body>
</html>
